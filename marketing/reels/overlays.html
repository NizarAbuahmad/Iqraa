<!doctype html>
<meta charset="utf-8">
<title>Iqraa reel overlays</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{ --navy:#081B3A; --teal:#00A99D; --aqua:#34D6C6; --muted:#8BA0B8; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{font-family:"Almarai",sans-serif;direction:rtl;width:1080px}
.o{position:absolute;left:0;top:0}

/* Headlines: right edge x=960 (clear of the Reels action rail), top >= 290 */
.head{width:900px;text-align:right;font-family:"Cairo";font-weight:900;font-size:78px;line-height:1.28;color:#fff;text-wrap:balance;padding:6px 0 18px;
  text-shadow:0 4px 24px rgba(3,12,28,.55)}
.head .hl{color:var(--aqua)}
.head .n{color:var(--aqua);unicode-bidi:isolate}

.chip{display:inline-flex;align-items:center;gap:14px;padding:12px 28px;border-radius:999px;
  background:rgba(52,214,198,.14);border:2px solid rgba(52,214,198,.55);
  font-family:"Cairo";font-weight:700;font-size:34px;color:#fff;white-space:nowrap}
.chip i{font-style:normal;color:var(--aqua)}
.demo{display:inline-flex;align-items:center;padding:8px 22px;border-radius:999px;background:rgba(8,27,58,.78);
  border:2px solid rgba(139,160,184,.55);font-family:"Almarai";font-weight:700;font-size:28px;color:#C9D6E6;white-space:nowrap}

/* End card: full 1080x1920, opaque */
.end{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--navy)}
.end .bg{position:absolute;inset:0;background:
  radial-gradient(900px 760px at 50% 30%, rgba(52,214,198,.20), transparent 62%),
  radial-gradient(800px 700px at 8% 92%, rgba(0,169,157,.16), transparent 65%),
  var(--navy)}
.end .col{position:absolute;left:60px;right:120px;top:360px;display:flex;flex-direction:column;align-items:center;text-align:center}
.end img{width:470px;display:block}
.end .name{font-family:"Cairo";font-weight:900;font-size:150px;line-height:1.1;color:#fff;margin-top:34px}
.end .cta{font-family:"Cairo";font-weight:900;font-size:80px;line-height:1.3;color:#fff;margin-top:70px}
.end .cta .hl{color:var(--aqua)}
.end .url{margin-top:64px;direction:ltr;display:inline-block;background:var(--aqua);color:#06243F;
  font-family:"Cairo";font-weight:900;font-size:58px;padding:24px 62px;border-radius:999px;
  box-shadow:0 22px 56px rgba(52,214,198,.34);letter-spacing:.01em}
.end .rule{width:150px;height:6px;border-radius:99px;background:var(--teal);margin-top:56px}
</style>

<div id="hook"   class="o head">أول مرة على <span class="hl">اقرأ</span>؟<br>ابدأ من هون 👇</div>
<div id="step1"  class="o head"><span class="n">١.</span> اختار الأداة اللي بتحتاجها</div>
<div id="step2"  class="o head"><span class="n">٢.</span> أضف تفاصيل الدرس</div>
<div id="step3"  class="o head"><span class="n">٣.</span> راجع النتيجة</div>
<div id="chip"   class="o chip"><i>الصف العاشر</i> · الجغرافيا · الغلاف الجوي</div>
<div id="demo"   class="o demo">وضع العرض · محتوى تجريبي</div>

<div id="end" class="o end"><div class="bg"></div>
  <div class="col">
    <img src="assets/logo-wordmark.png" alt="">
    <div class="rule"></div>
    <div class="cta">جرّبها على درسك <span class="hl">الجاي</span></div>
    <div class="url">www.iqrra.com</div>
  </div>
</div>
