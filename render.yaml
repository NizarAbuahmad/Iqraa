# Render Blueprint — the static web app only.
#
# One service:
#   iqraa-web      — Expo web static export (always awake; static files)
#
# Compute moved to Google Cloud Run on 2026-09-05 — see the note in the
# services block below for why, and for how to roll it back. What runs where
# now:
#   iqraa-web      — Render (this file)
#   iqraa-api      — Cloud Run, project iqraa-auth-507315, europe-west1
#   iqraa-verifier — Cloud Run, same project and region
#   database       — Neon (unchanged; free Postgres, persists — Render's free
#                    Postgres is deleted after 30 days)
#   media          — Cloudflare R2 (unchanged)
#
# Secrets for the two Cloud Run services live in the Cloud Run console, not
# here. Nothing in this file needs DATABASE_URL or OPENAI_API_KEY any more.
#
# SCHEMA IS NOT DEPLOYED. No build step here touches the database — the
# tables come from `pnpm --filter @workspace/db run push`, run by hand
# against the Neon DATABASE_URL. Whenever a release adds or changes a
# table, run that push before or with the deploy, or the endpoints that
# use the new table answer 503 "storage is not set up on this server"
# (see failRoster in artifacts/api-server/src/routes/roster.ts). Push is
# deliberately not wired into buildCommand: drizzle-kit resolves drift by
# dropping columns, and a deploy is the wrong place to discover that.
#
# That decision stands. What changed on 2026-08-25 is that something now asks
# whether the push happened, instead of nobody noticing for days:
#   - .github/workflows/ci.yml — a PR touching lib/db/src/schema must say
#     `schema-push: done` or `schema-push: n/a` in its description.
#   - .github/workflows/schema-check.yml — runs verify-schema against the
#     production DATABASE_URL daily, on demand, and whenever a schema change
#     reaches main. Read-only; needs a DATABASE_URL repository secret.

services:
  # iqraa-api and iqraa-verifier used to be defined here. They moved to
  # Cloud Run on 2026-09-05 and were deleted from Render once it had proven
  # itself under real traffic.
  #
  # Why they moved: Render free-tier sleeps a service after 15 minutes and
  # takes 31-51s to wake it. The verifier is behind a client timeout, so a
  # teacher opening the app in the morning got zero verified answers, every
  # morning, with no error to explain it. Cloud Run wakes in 4.59s, which
  # fits inside the timeout. Measured on both, not assumed.
  #
  # They are NOT defined here any more on purpose. Leaving the blocks in
  # place would let a Blueprint sync quietly recreate both services --
  # the same trap that kept MATH_VERIFIER_URL pointing at a dead address
  # for three weeks. The file is the source of truth; deleting in the
  # dashboard alone does not stick.
  #
  # To bring them back (rollback): restore these blocks from git history,
  # re-enter every secret in the Render dashboard, and point
  # EXPO_PUBLIC_API_BASE_URL below back at the Render API. Note the secrets
  # do not come back with the file -- they never lived here.
  #
  # iqraa-web stays on Render: static, free, never sleeps, nothing to gain
  # from moving. Neon and R2 are unaffected by where compute runs.
  - type: web
    name: iqraa-web
    runtime: static
    # `build:web` = expo export + scripts/inject-pwa.mjs. The export alone
    # produces an index.html with no manifest link, so the site is visitable
    # but not installable — see that script's header for why the manifest
    # cannot come from app/+html.tsx.
    buildCommand: corepack enable && corepack prepare pnpm@11.18.0 --activate && pnpm install --frozen-lockfile && cd artifacts/mobile && pnpm run build:web
    staticPublishPath: artifacts/mobile/dist
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      # Baked into the JS bundle at build time, so changing it needs a web
      # rebuild, not just a redeploy of the API.
      #
      # Points at Cloud Run, not Render, since 2026-09-05. The reason is the
      # verifier's cold start, measured on both: Render's free tier takes
      # 31-51s to wake a sleeping service, Cloud Run 4.59s. No client timeout
      # can survive the first, and 15s clears the second comfortably — so on
      # Render a teacher's first quiz of the day silently got zero verified
      # answers, every morning, with no error to explain it. Observed live on
      # 2026-09-04: same lesson, same question types, 0 of 6 verified against
      # a cold verifier and several against a warm one.
      #
      # `iqraa-web` itself stays on Render: it is a static site, free, and
      # never sleeps, so it has nothing to gain from moving. Neon and R2 stay
      # too. Only the two services that sleep moved.
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://iqraa-api-613126375862.europe-west1.run.app/api
      # Same Google OAuth web client ID as GOOGLE_CLIENT_ID on the Cloud Run
      # api service (set there, not here).
      # sync: false (not a hardcoded value like the PostHog key below) only
      # because the client ID doesn't exist yet — once created it is not
      # secret, EXPO_PUBLIC_* is inlined into the JS bundle at build time regardless.
      - key: EXPO_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      # PostHog ingest token. A plain value rather than `sync: false` on
      # purpose: `EXPO_PUBLIC_*` is inlined into the JS bundle at BUILD time,
      # so this string is public the moment the site deploys — a `phc_` token
      # is write-only and designed for exactly that. Treating it as a secret
      # would only hide it from the repo, not from the browser.
      #
      # Undeclared until 2026-08-19, which is why it was never set: with no
      # key `services/analytics.ts` sets `client = null` and every trackEvent
      # silently no-ops, so the app looked instrumented and collected nothing.
      # Declaring it here means the next person does not have to find that out
      # from the source.
      #
      # US cloud, so EXPO_PUBLIC_POSTHOG_HOST is left unset — analytics.ts
      # already defaults to https://us.i.posthog.com. An EU project would need
      # it set to https://eu.i.posthog.com.
      - key: EXPO_PUBLIC_POSTHOG_API_KEY
        value: phc_t7Gd3Z4L7v3zDkPAciXoCvndiVqGfVxzGquEfbJPq9r8
    # Expo Router is a single-page app: every path must serve index.html
    # or deep links (e.g. /workspace) 404 on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
