# Render Blueprint — free-tier demo deployment.
#
# Three services:
#   iqraa-api      — Express API (free web service; sleeps after ~15 min idle,
#                    first request after sleep takes ~30-60s to wake)
#   iqraa-web      — Expo web static export (always awake; static files)
#   iqraa-verifier — SymPy math verifier (FastAPI). The API proxies it at
#                    /api/verify/derivative. Without it deployed, the app
#                    cannot symbolically verify anything in production and
#                    honestly falls back to the "reviewed bank" label.
# Database lives on Neon (free Postgres), NOT on Render — Render's free
# Postgres is deleted after 30 days, Neon's free tier persists.
#
# Both DATABASE_URL and OPENAI_API_KEY are set by hand in the Render
# dashboard on first deploy (sync: false below). OPENAI_API_KEY can be a
# placeholder while the app runs with DEMO_MODE = true — the AI endpoints
# are not exercised by the demo.
#
# SCHEMA IS NOT DEPLOYED. No build step here touches the database — the
# tables come from `pnpm --filter @workspace/db run push`, run by hand
# against the Neon DATABASE_URL. Whenever a release adds or changes a
# table, run that push before or with the deploy, or the endpoints that
# use the new table answer 503 "storage is not set up on this server"
# (see failRoster in artifacts/api-server/src/routes/roster.ts). Push is
# deliberately not wired into buildCommand: drizzle-kit resolves drift by
# dropping columns, and a deploy is the wrong place to discover that.

services:
  - type: web
    name: iqraa-api
    runtime: node
    plan: free
    # `--filter @workspace/api-server...` (trailing dots = "and its workspace
    # dependencies") installs 5 of the 11 projects instead of all of them. The
    # unfiltered form pulled the entire Expo/React Native/pptxgenjs tree —
    # ~665MB of node_modules the API never imports — into a free-tier builder,
    # which is slow and a plausible OOM/timeout source on a constrained box.
    buildCommand: corepack enable && corepack prepare pnpm@11.18.0 --activate && pnpm install --frozen-lockfile --filter @workspace/api-server... && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Points the API's mathVerifierClient at the deployed verifier below.
      # fromService keeps the URL correct even if Render suffixes the name.
      - key: MATH_VERIFIER_URL
        fromService:
          type: web
          name: iqraa-verifier
          property: hostport

  - type: web
    name: iqraa-verifier
    runtime: python
    plan: free
    rootDir: artifacts/math-verifier
    # `--retries`/`--timeout` are the point of this line. A deploy failed with
    # "too many 502 error responses" fetching uvicorn's wheel metadata from
    # files.pythonhosted.org — PyPI's CDN, not this repo. pip's defaults gave
    # up too early on a blip that a few more attempts would have ridden out.
    buildCommand: pip install --retries 10 --timeout 30 -r requirements.txt
    # Single worker: the service forks a ProcessPoolExecutor per request so a
    # runaway SymPy job can be killed on timeout.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      # This service was the only one of the three pinning no runtime version —
      # both Node services pin NODE_VERSION, this pinned nothing. The build log
      # shows what that meant in practice: "Using Python version 3.14.3
      # (default)", a version nothing in CI has ever exercised.
      #
      # `uvicorn[standard]` pulls uvloop, httptools and watchfiles (C
      # extensions) plus pydantic-core (Rust). Those install as wheels on a
      # supported Python and compile from source on one without — which the
      # free-tier builder cannot do. Whether 3.14 has wheels for all of them is
      # exactly the question nobody should have to ask on a deploy.
      #
      # To be clear about what this did NOT fix: the 2026-08-18 failure was a
      # PyPI 502, not an interpreter problem. This pin is hardening, chosen
      # because 3.12.13 is what CI resolves against — so a green `math
      # verifier` job means the deploy ran on the same interpreter.
      - key: PYTHON_VERSION
        value: 3.12.13

  - type: web
    name: iqraa-web
    runtime: static
    # `build:web` = expo export + scripts/inject-pwa.mjs. The export alone
    # produces an index.html with no manifest link, so the site is visitable
    # but not installable — see that script's header for why the manifest
    # cannot come from app/+html.tsx.
    buildCommand: corepack enable && corepack prepare pnpm@11.18.0 --activate && pnpm install --frozen-lockfile && cd artifacts/mobile && pnpm run build:web
    staticPublishPath: artifacts/mobile/dist
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      # Baked into the JS bundle at build time. Must be the API service's
      # public URL + /api. The plain iqraa-api.onrender.com name was taken,
      # so Render assigned this suffixed hostname on first deploy.
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://iqraa-api-dfxu.onrender.com/api
    # Expo Router is a single-page app: every path must serve index.html
    # or deep links (e.g. /workspace) 404 on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
