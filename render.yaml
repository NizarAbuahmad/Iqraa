# Render Blueprint — free-tier demo deployment.
#
# Three services:
#   iqraa-api      — Express API (free web service; sleeps after ~15 min idle,
#                    first request after sleep takes ~30-60s to wake)
#   iqraa-web      — Expo web static export (always awake; static files)
#   iqraa-verifier — SymPy math verifier (FastAPI). The API proxies it at
#                    /api/verify/derivative. Without it deployed, the app
#                    cannot symbolically verify anything in production and
#                    honestly falls back to the "reviewed bank" label.
# Database lives on Neon (free Postgres), NOT on Render — Render's free
# Postgres is deleted after 30 days, Neon's free tier persists.
#
# Both DATABASE_URL and OPENAI_API_KEY are set by hand in the Render
# dashboard on first deploy (sync: false below). OPENAI_API_KEY can be a
# placeholder while the app runs with DEMO_MODE = true — the AI endpoints
# are not exercised by the demo.
#
# SCHEMA IS NOT DEPLOYED. No build step here touches the database — the
# tables come from `pnpm --filter @workspace/db run push`, run by hand
# against the Neon DATABASE_URL. Whenever a release adds or changes a
# table, run that push before or with the deploy, or the endpoints that
# use the new table answer 503 "storage is not set up on this server"
# (see failRoster in artifacts/api-server/src/routes/roster.ts). Push is
# deliberately not wired into buildCommand: drizzle-kit resolves drift by
# dropping columns, and a deploy is the wrong place to discover that.

services:
  - type: web
    name: iqraa-api
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.18.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Points the API's mathVerifierClient at the deployed verifier below.
      # fromService keeps the URL correct even if Render suffixes the name.
      - key: MATH_VERIFIER_URL
        fromService:
          type: web
          name: iqraa-verifier
          property: hostport

  - type: web
    name: iqraa-verifier
    runtime: python
    plan: free
    rootDir: artifacts/math-verifier
    buildCommand: pip install -r requirements.txt
    # Single worker: the service forks a ProcessPoolExecutor per request so a
    # runaway SymPy job can be killed on timeout.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz

  - type: web
    name: iqraa-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@11.18.0 --activate && pnpm install --frozen-lockfile && cd artifacts/mobile && pnpm exec expo export --platform web
    staticPublishPath: artifacts/mobile/dist
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      # Baked into the JS bundle at build time. Must be the API service's
      # public URL + /api. The plain iqraa-api.onrender.com name was taken,
      # so Render assigned this suffixed hostname on first deploy.
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://iqraa-api-dfxu.onrender.com/api
    # Expo Router is a single-page app: every path must serve index.html
    # or deep links (e.g. /workspace) 404 on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
