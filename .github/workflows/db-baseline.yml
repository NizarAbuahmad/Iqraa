# One-time: record migration 0000 as already applied on production, which got
# its tables from `push` before migrations existed. Until this runs, deploy.yml's
# `production migrations` job refuses (safely — the old revision keeps serving).
# Runs here rather than on a laptop so the production URL never leaves the
# repository secret. Idempotent; refuses an empty database. Delete this file
# once production is baselined. See docs/deploying.md, «Schema».
name: DB baseline (one-time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile --filter @workspace/db...

      - name: Verify, then baseline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @workspace/db run verify-schema -- --from-env
          pnpm --filter @workspace/db run migrate -- --from-env --baseline
          pnpm --filter @workspace/db run migrate -- --from-env
