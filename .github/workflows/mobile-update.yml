# What this is for
#
# Three surfaces carry the same `@workspace/curriculum` package and used to
# move at three different speeds: web auto-deploys on every merge (render.yaml
# has no buildFilter), the API is deployed by hand, and the app only moved when
# somebody remembered to build it. A curriculum change could sit on the web for
# days before reaching a single phone.
#
# This workflow removes the "somebody remembered" step for JS and content: the
# same merge that triggers Render's web deploy publishes an over-the-air update
# for the app. Native changes still need a real build — expo-updates refuses to
# serve an update across a runtimeVersion boundary, and app.json's fingerprint
# policy moves that boundary whenever the native surface changes.
#
# Publishes to the `preview` channel, which is what the internally distributed
# APK builds carry. When the Play Store listing goes live, the store build will
# carry `production` and this needs a second publish (or a channel switch).
#
# BLOCKED, and why the merge trigger is off: EAS caps an update at 1000 assets
# and this app ships 1368, of which 1290 are the figure PNGs `require()`d by
# services/bookFigureAssets.ts.
#
#   Each update is limited to a maximum of 1000 assets (attempted 1368).
#
# No flag fixes that — the cap counts everything the bundle references, not
# what a device would actually download. Every merge would fail here, and a
# workflow that always fails is one people stop reading, so it runs by hand
# until the asset count comes down (serving figures rather than bundling them)
# or the cap is raised. The figure corpus grows ~25 MB per grade batch, so this
# gets worse on its own, and the same bundling pushes at Play's AAB size limit.
name: Mobile OTA update

# DISABLED ON MERGE, deliberately — see the asset-limit note below. Restore
# the `push` trigger once an update can actually publish:
#
#   push:
#     branches: [main]
#
on:
  # Manual only for now. Also covers re-publishing after a failed run, and the
  # `branch` input is what will publish to the `production` channel once a
  # Play Store build exists, without needing a second workflow.
  workflow_dispatch:
    inputs:
      branch:
        description: EAS update branch to publish to
        required: true
        default: preview
        type: choice
        options: [preview, production]

# Two updates racing on the same branch would leave devices on whichever
# finished last rather than whichever was merged last.
concurrency:
  group: mobile-update
  cancel-in-progress: false

jobs:
  publish:
    name: eas update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level so the step `if:` conditions below can read it. A step's own
    # `env:` block is NOT visible to that step's `if:`.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `git log -1` needs the commit itself; depth 2 keeps that working on
          # a squash-merge commit without cloning the whole history.
          fetch-depth: 2

      # Same Node and pnpm as ci.yml and the Render build, so a bundle that
      # builds here is one that builds there.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish update
        if: ${{ env.EXPO_TOKEN != '' }}
        working-directory: artifacts/mobile
        env:
          # eas update does NOT read eas.json's build-profile `env` blocks —
          # those apply to builds only. Omit these and the update ships
          # pointing at nothing, which fails silently on the device rather than
          # here. Duplicated from eas.json's `preview` profile; they are public
          # client config, not secrets.
          EXPO_PUBLIC_API_BASE_URL: https://iqraa-api-613126375862.europe-west1.run.app/api
          EXPO_PUBLIC_DEMO_MODE: "false"
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: 784063967007-86omgnji0cg28iaav1o1celb8cm9je26.apps.googleusercontent.com
        # --platform android because eas.json declares no iOS build profile at
        # all: an iOS bundle here would be exported, uploaded and stored for a
        # binary that does not exist. It also roughly doubles export time and
        # adds a second way for this job to fail on a platform nobody has ever
        # built.
        run: |
          npx eas-cli@latest update \
            --branch "${{ inputs.branch || 'preview' }}" \
            --platform android \
            --message "$(git log -1 --pretty=%s)" \
            --non-interactive

      # A red X on every merge would train people to ignore CI, so an absent
      # token is a clean skip that says what to do about it.
      - name: Explain a skipped publish
        if: ${{ env.EXPO_TOKEN == '' }}
        run: |
          echo "EXPO_TOKEN is not set — no update published."
          echo "Add it under Settings → Secrets and variables → Actions."
          echo "Until then the app only changes when someone runs a build by hand."
