# What this is for
#
# The repo had no checks at all: pull requests merged with zero signal, and
# `main` is the only branch that deploys. Two things this catches that already
# went wrong once each — a branch based on a stale `main` silently reverting
# work, and the api-server suite passing or failing against a `dist/` bundle
# built from different source than the one under review.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same Node and pnpm the Render build uses, so a green CI means the
      # deploy has already been exercised on these versions.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      # Covers lib/* project references plus every artifact's own typecheck.
      - name: Typecheck
        run: pnpm run typecheck

      # MUST run before the api-server tests. Its mount-order suite boots
      # dist/index.mjs rather than the source, and `pnpm test` does not build.
      # Without this step the suite either skips (no bundle) or — worse —
      # reports on a stale one, which is exactly how a fixed bug appeared to
      # still be failing.
      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Test api-server
        run: pnpm --filter @workspace/api-server run test

      - name: Test mobile
        run: pnpm --filter @workspace/mobile run test

      - name: Test curriculum
        run: pnpm --filter @workspace/curriculum run test

      # Structural errors in curriculum data fail the build; content gaps are
      # printed and do not. Phase one is grades 1-10, so this table is the only
      # thing that will keep saying how much of it is actually grounded.
      - name: Verify curriculum data
        run: pnpm --filter @workspace/curriculum run verify

  # A schema change is the one edit in this repo that does not deploy itself.
  #
  # `render.yaml` says so at the top and explains why: `drizzle-kit push`
  # resolves drift by dropping columns, so it is deliberately kept out of the
  # build. The cost is that adding a table and forgetting the push ships
  # endpoints that answer 503 — on 2026-08-19 that went unnoticed until 14 of
  # 24 tables were absent from production, the entire evaluations subsystem
  # among them. Nobody was lying; nothing asked the question.
  #
  # This job asks it at the only moment someone can still act on it cheaply:
  # while the change is still a pull request. It does not run the push, and it
  # cannot tell whether you ran it — it makes the decision explicit instead of
  # implicit, which is the whole difference between that outage and a chore.
  schema-push:
    name: schema push acknowledged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did this PR change the schema?
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # `git diff base...head` compares against the merge base, so commits
          # that landed on main since this branch started are not counted as
          # this PR's changes.
          FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- lib/db/src/schema || true)
          if [ -n "$FILES" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "Schema files changed:"
            echo "$FILES"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "No schema files changed."
          fi

      - name: Require an explicit answer about the push
        if: steps.changed.outputs.touched == 'true'
        env:
          # Body text is untrusted input from whoever opened the PR, so it goes
          # through the environment rather than being interpolated into the
          # script, where a backtick would run.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if printf '%s' "$PR_BODY" | grep -qiE '^[[:space:]]*schema-push:[[:space:]]*(done|n/a|not-needed)'; then
            echo "Acknowledged in the PR body."
            exit 0
          fi
          cat <<'MSG'
          This PR changes lib/db/src/schema, and the schema does not deploy itself.

          Run the push against the production DATABASE_URL:

              pnpm --filter @workspace/db run push

          then confirm it with `pnpm --filter @workspace/db run verify-schema`.

          Add ONE of these lines to the PR description to clear this check:

              schema-push: done        (pushed — production has the new tables)
              schema-push: n/a         (types or comments only; no new table or column)

          Not a formality: on 2026-08-19 a skipped push left 14 of 24 tables
          missing from production and the evaluations subsystem could not work
          there at all.
          MSG
          exit 1

  verifier:
    name: math verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sympy
        working-directory: artifacts/math-verifier
        run: pip install -r requirements.txt

      # These pin what may claim "تم التحقق من الإجابة رياضيًا" on a classroom
      # screen. A regression here mislabels wrong answers as verified.
      - name: Verification regression tests
        working-directory: artifacts/math-verifier
        env:
          PYTHONIOENCODING: utf-8
        run: python -X utf8 test_equations.py
