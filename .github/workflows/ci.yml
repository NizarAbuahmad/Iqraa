# What this is for
#
# The repo had no checks at all: pull requests merged with zero signal, and
# `main` is the only branch that deploys. Two things this catches that already
# went wrong once each — a branch based on a stale `main` silently reverting
# work, and the api-server suite passing or failing against a `dist/` bundle
# built from different source than the one under review.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Without this block a workflow inherits the repository default, which can be
# write-all — so every job here would run holding a token able to push to main,
# publish a release or open an issue, to check out a branch and run tests.
# deploy.yml already declares its own (it needs `id-token: write` for the
# Google OIDC exchange); this is the same statement for the workflows that need
# nothing but the source.
permissions:
  contents: read

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same Node and pnpm the Render build uses, so a green CI means the
      # deploy has already been exercised on these versions.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      # Covers lib/* project references plus every artifact's own typecheck.
      - name: Typecheck
        run: pnpm run typecheck

      # The brand is «إقرأ» (hamzat qatʿ) — Nizar, 2026-10-07, site first, then
      # the app. The verb «اقرأ» (read) is legitimate copy — reading activities,
      # lab steps, slide steps, prompt guidance — so this is not a blanket ban:
      # it checks the files that carry the product's name (none of them uses the
      # verb) and the quoted form «اقرأ» anywhere copy ships from. i18n copy is
      # also covered by i18nTerminology.test.ts. Book text under lib/curriculum
      # quotes ministry PDFs verbatim, and the marketing renders keep the text
      # they were produced with; both are out of scope.
      - name: Brand is «إقرأ», never «اقرأ»
        run: |
          named=(artifacts/api-server/src/lib/email.ts artifacts/api-server/src/lib/chatPrompts.ts
                 artifacts/mobile/app.json artifacts/mobile/public/manifest.webmanifest artifacts/mobile/scripts/inject-pwa.mjs
                 artifacts/mobile/services/i18n.ts artifacts/mobile/services/ai/intentRouter.ts
                 artifacts/mobile/services/exportHtml.ts artifacts/mobile/services/exportText.ts artifacts/mobile/services/deckSlidesHtml.ts
                 artifacts/mobile/services/commandPalette.ts artifacts/mobile/services/claimCodeMessage.ts artifacts/mobile/services/mathSupportResources.ts
                 artifacts/mobile/components/RosterConsentGate.tsx artifacts/mobile/components/ui/IqraaMark.tsx)
          paths=(artifacts/*/src artifacts/mobile/app artifacts/mobile/components artifacts/mobile/services ':!*i18nTerminology.test.ts')
          if git grep -nI 'اقرأ' -- "${named[@]}" || git grep -nI '«اقرأ»' -- "${paths[@]}"; then
            echo "::error::«اقرأ» is the old spelling — the brand is «إقرأ» (hamzat qatʿ). The verb «read» is fine, but not in a file that names the product, and never in guillemets."
            exit 1
          fi

      # MUST run before the api-server tests. Its mount-order suite boots
      # dist/index.mjs rather than the source, and `pnpm test` does not build.
      # Without this step the suite either skips (no bundle) or — worse —
      # reports on a stale one, which is exactly how a fixed bug appeared to
      # still be failing.
      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Test api-server
        run: pnpm --filter @workspace/api-server run test

      - name: Test mobile
        run: pnpm --filter @workspace/mobile run test

      - name: Test curriculum
        run: pnpm --filter @workspace/curriculum run test

      # The package has declared a `test` script since it was split out, and
      # nothing ever ran it — the maths bank's invariants were unguarded in CI
      # for the same reason the chemistry bank's would have been.
      - name: Test practice banks
        run: pnpm --filter @workspace/math-practice run test

      # The client-side half of the answer-key gate, and the one package with
      # real tests that CI was not running. lib/math-verify refuses to
      # transliterate «ق(س)» into `f(x)` before anything reaches SymPy —
      # CLAUDE.md names this a safety rail, because SymPy does not reject
      # Arabic, it multiplies it, and returns `answer_mismatch` that is
      # indistinguishable from a genuinely wrong key. The suite was typechecked
      # by the step above and never executed, so a regression to that gate
      # would have shipped silently.
      - name: Test math-verify
        run: pnpm --filter @workspace/math-verify run test

      # The spelling bank behind the Arabic إملاء worksheets. Same story as
      # math-verify above: it declared a `test` script from the day it was
      # written and nothing ran it, so eight rules sat below the suite's
      # own eight-word floor until 2026-10-02.
      - name: Test arabic-spelling
        run: pnpm --filter @workspace/arabic-spelling run test

      # Structural errors in curriculum data fail the build; content gaps are
      # printed and do not. Phase one is grades 1-10, so this table is the only
      # thing that will keep saying how much of it is actually grounded.
      - name: Verify curriculum data
        run: pnpm --filter @workspace/curriculum run verify

  # The schema deploys itself: deploy.yml runs `migrate` against production
  # before the API ships. That makes the migration files the contract, so this
  # job proves, while the change is still a PR, that they are complete and that
  # they apply. It replaced a job that only asked the author to write
  # `schema-push: done` in the PR body — PR #815 cleared it with a wrong answer.
  migrations:
    name: migrations match schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile --filter @workspace/db...

      # generate never connects; it diffs src/schema against migrations/meta.
      # Any output means a schema edit landed without its migration.
      - name: Every schema change has a migration
        run: |
          set -euo pipefail
          pnpm --filter @workspace/db run generate
          if [ -n "$(git status --porcelain lib/db/migrations)" ]; then
            git status --porcelain lib/db/migrations
            echo "::error::lib/db/src/schema changed without a migration. Run \`pnpm --filter @workspace/db run generate\` and commit lib/db/migrations."
            exit 1
          fi

      - name: Migrations apply to an empty database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm --filter @workspace/db run migrate -- --from-env
          pnpm --filter @workspace/db run verify-schema -- --from-env

      # deploy.yml migrates BEFORE the new API revision takes traffic, so the
      # old revision serves against the new schema for a few minutes. Adding is
      # safe; dropping, renaming or tightening a column breaks the running code.
      # Ship those as a second PR once nothing reads the old shape, and say so.
      - name: Destructive migrations are acknowledged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Untrusted input: through the environment, never interpolated.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          NEW=$(git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" -- 'lib/db/migrations/*.sql')
          [ -z "$NEW" ] && exit 0
          HITS=$(grep -n -i -E 'DROP (TABLE|COLUMN)|RENAME|SET NOT NULL|SET DATA TYPE' $NEW || true)
          [ -z "$HITS" ] && exit 0
          echo "$HITS"
          if printf '%s' "$PR_BODY" | grep -qiE '^[[:space:]]*destructive-migration:[[:space:]]*ok'; then
            echo "Acknowledged in the PR body."
            exit 0
          fi
          echo "::error::This migration drops, renames or tightens something the running API may still use. Split it out, or add 'destructive-migration: ok' to the PR body once nothing reads the old shape."
          exit 1

  verifier:
    name: math verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sympy
        working-directory: artifacts/math-verifier
        run: pip install -r requirements.txt

      # These pin what may claim "تم التحقق من الإجابة رياضيًا" on a classroom
      # screen. A regression here mislabels wrong answers as verified.
      - name: Verification regression tests
        working-directory: artifacts/math-verifier
        env:
          PYTHONIOENCODING: utf-8
        run: python -X utf8 test_equations.py
